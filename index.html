<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>US Stock Portfolio & TQQQ Strategy Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #121218;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }
  </style>
</head>
<body class="bg-[#121218] min-h-screen flex justify-center items-center p-0 sm:p-4">
  <div id="root" class="w-full max-w-md bg-[#1A1A24] min-h-screen sm:min-h-[844px] sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative border border-gray-800"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // SVG Icons
    const Icons = {
      Plus: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>,
      List: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>,
      Search: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
      History: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      Refresh: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>,
      Trash: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
      ChevronLeft: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg>,
      ExternalLink: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>,
      Key: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>,
      Lightning: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>,
      Alert: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>,
      Shield: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
    };

    const cleanSymbol = (input) => {
      if (!input) return '';
      let sym = input.trim().toUpperCase();
      if (sym.includes(':')) {
        sym = sym.split(':')[1].trim();
      }
      return sym;
    };

    const getTodayDate = () => {
      const d = new Date();
      const month = `${d.getMonth() + 1}`.padStart(2, '0');
      const day = `${d.getDate()}`.padStart(2, '0');
      return `${d.getFullYear()}-${month}-${day}`;
    };

    const formatUSD = (val) => {
      if (val === null || val === undefined || isNaN(val)) return '$0.00';
      return '$' + Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    const formatPercent = (val) => {
      if (val === null || val === undefined || isNaN(val)) return '0.00%';
      const formatted = Number(val).toFixed(2) + '%';
      return val >= 0 ? `+${formatted}` : formatted;
    };

    // Stock quote fetcher using Finnhub API exclusively
    const fetchFinnhubQuote = async (rawSymbol, apiKey = '') => {
      const symbol = cleanSymbol(rawSymbol);
      if (!symbol || !apiKey || !apiKey.trim()) return null;

      try {
        const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(symbol)}&token=${encodeURIComponent(apiKey.trim())}`);
        if (res.ok) {
          const data = await res.json();
          if (data && (data.c > 0 || data.pc > 0)) {
            const price = data.c || data.pc;
            const prevClose = data.pc;
            const high = data.h || price;
            const change = data.d || (price - prevClose);
            const changePercent = data.dp || (prevClose ? (change / prevClose) * 100 : 0);
            return {
              symbol,
              price,
              prevClose,
              high,
              change,
              changePercent,
              source: 'Finnhub API'
            };
          }
        }
      } catch (e) {
        console.warn(`Finnhub fetch failed for ${symbol}:`, e);
      }
      return null;
    };

    function App() {
      // Navigation
      const [view, setView] = useState('tqqq'); // 'tqqq', 'hi5_core', 'portfolio', 'add', 'search', 'history', 'edit'

      // Persistent Data
      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('st_records');
        return saved ? JSON.parse(saved) : [];
      });

      const [targetAmount, setTargetAmount] = useState(() => {
        return localStorage.getItem('st_target_amount') || '50000';
      });

      const [finnhubApiKey, setFinnhubApiKey] = useState(() => {
        return localStorage.getItem('st_finnhub_key') || '';
      });

      // Hi5 & Core Tickers Persistent Config
      const [hi5Tickers, setHi5Tickers] = useState(() => {
        const saved = localStorage.getItem('st_hi5_tickers');
        return saved ? JSON.parse(saved) : ['RSP', 'VOO', 'QQQ', 'SCHD', 'IWM'];
      });

      const [coreTickers, setCoreTickers] = useState(() => {
        const saved = localStorage.getItem('st_core_tickers');
        return saved ? JSON.parse(saved) : ['AAPL', 'MSFT', 'GOOGL'];
      });

      // TQQQ Strategy Specific State
      const [accountValue, setAccountValue] = useState(() => {
        return localStorage.getItem('st_account_value') || '100000';
      });

      const [qqqHistHigh, setQqqHistHigh] = useState(() => {
        return localStorage.getItem('st_qqq_hist_high') || '540.00';
      });

      const [qqqHighDate, setQqqHighDate] = useState(() => {
        return localStorage.getItem('st_qqq_high_date') || '2024-07-10';
      });

      const [customBeta, setCustomBeta] = useState(() => {
        return localStorage.getItem('st_custom_beta') || '1.80';
      });

      const [mnqContractMultiplier, setMnqContractMultiplier] = useState('2');

      const [vixValue, setVixValue] = useState(() => {
        return localStorage.getItem('st_vix_value') || '13.50';
      });

      const [tqqqNotes, setTqqqNotes] = useState(() => {
        return localStorage.getItem('st_tqqq_notes') || '';
      });

      // Price Cache
      const [prices, setPrices] = useState({});
      const [loadingPrices, setLoadingPrices] = useState(false);

      // Form State (Add / Edit)
      const [formId, setFormId] = useState(null);
      const [formSymbol, setFormSymbol] = useState('');
      const [formDate, setFormDate] = useState(getTodayDate());
      const [formPrice, setFormPrice] = useState('');
      const [formQty, setFormQty] = useState('');
      const [formCategory, setFormCategory] = useState('stock_list'); // 'stock_list' or 'core_stocks'

      // Search State
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResult, setSearchResult] = useState(null);
      const [searchLoading, setSearchLoading] = useState(false);
      const [searchError, setSearchError] = useState('');

      useEffect(() => { localStorage.setItem('st_records', JSON.stringify(records)); }, [records]);
      useEffect(() => { localStorage.setItem('st_target_amount', targetAmount); }, [targetAmount]);
      useEffect(() => { localStorage.setItem('st_finnhub_key', finnhubApiKey); }, [finnhubApiKey]);
      useEffect(() => { localStorage.setItem('st_account_value', accountValue); }, [accountValue]);
      useEffect(() => { localStorage.setItem('st_qqq_hist_high', qqqHistHigh); }, [qqqHistHigh]);
      useEffect(() => { localStorage.setItem('st_qqq_high_date', qqqHighDate); }, [qqqHighDate]);
      useEffect(() => { localStorage.setItem('st_custom_beta', customBeta); }, [customBeta]);
      useEffect(() => { localStorage.setItem('st_vix_value', vixValue); }, [vixValue]);
      useEffect(() => { localStorage.setItem('st_tqqq_notes', tqqqNotes); }, [tqqqNotes]);
      useEffect(() => { localStorage.setItem('st_hi5_tickers', JSON.stringify(hi5Tickers)); }, [hi5Tickers]);
      useEffect(() => { localStorage.setItem('st_core_tickers', JSON.stringify(coreTickers)); }, [coreTickers]);

      // Unique Stock Symbols + Strategy tickers
      const allTrackedSymbols = useMemo(() => {
        const portfolioSyms = records.map(r => cleanSymbol(r.symbol));
        const strategySyms = ['QQQ', 'TQQQ', 'JEPQ', 'JAAA', 'MNQ', 'VIX', 'RSP'];
        return Array.from(new Set([...portfolioSyms, ...strategySyms, ...hi5Tickers, ...coreTickers])).filter(Boolean);
      }, [records, hi5Tickers, coreTickers]);

      // Refresh Prices via Finnhub
      const refreshPrices = async () => {
        if (!finnhubApiKey.trim()) return;
        setLoadingPrices(true);
        const newPrices = { ...prices };
        for (let sym of allTrackedSymbols) {
          const q = await fetchFinnhubQuote(sym, finnhubApiKey);
          if (q) newPrices[sym] = q;
        }
        setPrices(newPrices);
        setLoadingPrices(false);
      };

      useEffect(() => {
        if (finnhubApiKey) refreshPrices();
      }, [allTrackedSymbols.join(','), finnhubApiKey]);

      // Portfolio Aggregation for Stock List (general)
      const stockListRecords = useMemo(() => {
        return records.filter(r => !r.category || r.category === 'stock_list');
      }, [records]);

      const coreStockRecords = useMemo(() => {
        return records.filter(r => r.category === 'core_stocks');
      }, [records]);

      const aggregateByRecords = (recList) => {
        const group = {};
        recList.forEach(r => {
          const sym = cleanSymbol(r.symbol);
          if (!sym) return;

          if (!group[sym]) {
            group[sym] = { symbol: sym, records: [], totalQty: 0, totalCost: 0 };
          }

          const qty = Number(r.quantity) || 0;
          const price = Number(r.price) || 0;

          group[sym].records.push(r);
          group[sym].totalQty += qty;
          group[sym].totalCost += qty * price;
        });

        return Object.values(group).map(item => {
          const sortedRecs = [...item.records].sort((a,b) => new Date(a.date) - new Date(b.date));
          const lastRecord = sortedRecs[sortedRecs.length - 1] || {};
          
          const lastBuyPrice = Number(lastRecord.price) || 0;
          const avgBuyPrice = item.totalQty > 0 ? item.totalCost / item.totalQty : 0;
          const quote = prices[item.symbol] || {};
          const currentPrice = quote.price || 0;

          const lastDiffPct = lastBuyPrice > 0 && currentPrice > 0 ? ((currentPrice - lastBuyPrice) / lastBuyPrice) * 100 : 0;
          const avgDiffPct = avgBuyPrice > 0 && currentPrice > 0 ? ((currentPrice - avgBuyPrice) / avgBuyPrice) * 100 : 0;
          const marketValue = item.totalQty * (currentPrice || avgBuyPrice);

          return {
            ...item,
            lastBuyPrice,
            avgBuyPrice,
            currentPrice,
            lastDiffPct,
            avgDiffPct,
            marketValue,
            quote
          };
        });
      };

      const portfolioData = useMemo(() => aggregateByRecords(stockListRecords), [stockListRecords, prices]);
      const corePortfolioData = useMemo(() => aggregateByRecords(coreStockRecords), [coreStockRecords, prices]);

      const totalPortfolioValue = useMemo(() => {
        return portfolioData.reduce((sum, item) => sum + item.marketValue, 0);
      }, [portfolioData]);

      // TQQQ Strategy Calculations
      const numAccountVal = Number(accountValue) || 0;
      const numQqqHigh = Number(qqqHistHigh) || 1;
      const currentQqqPrice = prices['QQQ']?.price || numQqqHigh;
      const qqqDiffPct = numQqqHigh > 0 ? ((currentQqqPrice - numQqqHigh) / numQqqHigh) * 100 : 0;

      // Combination Allocation
      const alloc50Tqqq = numAccountVal * 0.50;
      const alloc65Tqqq = numAccountVal * 0.65;
      const alloc25Jepq = numAccountVal * 0.25;
      const alloc25Jaaa = numAccountVal * 0.25;

      const priceTqqq = prices['TQQQ']?.price || 70.0;
      const priceJepq = prices['JEPQ']?.price || 55.0;
      const priceJaaa = prices['JAAA']?.price || 50.0;

      const qtyTqqq = priceTqqq > 0 ? Math.round(alloc50Tqqq / priceTqqq) : 0;
      const qtyJepq = priceJepq > 0 ? Math.round(alloc25Jepq / priceJepq) : 0;
      const qtyJaaa = priceJaaa > 0 ? Math.round(alloc25Jaaa / priceJaaa) : 0;

      // Index Hedging
      const numBeta = Number(customBeta) || 1.8;
      const hedgeNotionalMarketVal = numAccountVal * numBeta; 
      const priceMnq = prices['MNQ']?.price || prices['QQQ']?.price * 40 || 20000;
      const multiplierMnq = Number(mnqContractMultiplier) || 2;
      const singleMnqVal = priceMnq * multiplierMnq; 
      const mnqContractsNeeded = singleMnqVal > 0 ? (hedgeNotionalMarketVal / singleMnqVal).toFixed(2) : '0.00';

      // Black Swan Insurance
      const numVix = prices['VIX']?.price || Number(vixValue) || 13.5;
      const isVixAlert = numVix < 14 || numVix > 35;
      const blackSwanVal = numAccountVal * 0.02;

      // RSP Data
      const rspQuote = prices['RSP'] || {};
      const rspChangePct = rspQuote.changePercent || 0;
      const isRspAlert = rspChangePct <= -1.0;

      // Handlers
      const handleSaveRecord = () => {
        const sym = cleanSymbol(formSymbol);
        if (!sym) return alert('請輸入有效的股票代碼。');
        if (!formPrice || Number(formPrice) <= 0) return alert('請輸入有效的買入價。');
        if (!formQty || Number(formQty) <= 0) return alert('請輸入有效的股數。');

        const newRecord = {
          id: formId || Date.now().toString(),
          symbol: sym,
          date: formDate,
          price: Number(formPrice),
          quantity: Number(formQty),
          category: formCategory
        };

        if (formId) {
          setRecords(prev => prev.map(r => r.id === formId ? newRecord : r));
          setView('history');
        } else {
          setRecords(prev => [newRecord, ...prev]);
          resetForm();
          setView(formCategory === 'core_stocks' ? 'hi5_core' : 'portfolio');
        }
      };

      const resetForm = () => {
        setFormId(null);
        setFormSymbol('');
        setFormDate(getTodayDate());
        setFormPrice('');
        setFormQty('');
        setFormCategory('stock_list');
      };

      const openEditRecord = (r) => {
        setFormId(r.id);
        setFormSymbol(r.symbol);
        setFormDate(r.date);
        setFormPrice(r.price);
        setFormQty(r.quantity);
        setFormCategory(r.category || 'stock_list');
        setView('edit');
      };

      const handleDeleteRecord = (id) => {
        if (confirm('確定刪除此買入紀錄？')) {
          setRecords(prev => prev.filter(r => r.id !== id));
          if (view === 'edit') setView('history');
        }
      };

      const handleSearch = async () => {
        const sym = cleanSymbol(searchQuery);
        if (!sym) return;
        if (!finnhubApiKey.trim()) {
          setSearchError('請先於 Setting 設定 Finnhub API Key 以執行搜尋。');
          return;
        }
        setSearchLoading(true);
        setSearchError('');
        setSearchResult(null);

        const res = await fetchFinnhubQuote(sym, finnhubApiKey);
        if (res) {
          setSearchResult(res);
        } else {
          setSearchError(`未能在 Finnhub 找到 ${sym} 的即時數據。`);
        }
        setSearchLoading(false);
      };

      // Helper for Hi5 & Core table calculation for a given ticker
      const getTickerSummary = (ticker) => {
        const sym = cleanSymbol(ticker);
        const tickerRecs = records.filter(r => cleanSymbol(r.symbol) === sym);
        let totalQty = 0;
        let totalCost = 0;

        tickerRecs.forEach(r => {
          const qty = Number(r.quantity) || 0;
          const price = Number(r.price) || 0;
          totalQty += qty;
          totalCost += qty * price;
        });

        const avgBuyPrice = totalQty > 0 ? totalCost / totalQty : 0;
        const q = prices[sym] || {};
        const currentPrice = q.price || 0;
        const pctDiff = avgBuyPrice > 0 && currentPrice > 0 ? ((currentPrice - avgBuyPrice) / avgBuyPrice) * 100 : 0;
        const totalAmount = totalQty * (currentPrice || avgBuyPrice);

        return {
          symbol: sym,
          currentPrice,
          avgBuyPrice,
          pctDiff,
          totalAmount,
          totalQty
        };
      };

      // Navigation Bar
      const renderBottomNav = () => (
        <div className="border-t border-gray-800 bg-[#161620] px-1 py-2 flex justify-around items-center sticky bottom-0 z-20 text-xs">
          <button onClick={() => setView('tqqq')} className={`flex flex-col items-center py-1 px-1.5 ${view === 'tqqq' ? 'text-amber-400 font-bold' : 'text-gray-400'}`}>
            <Icons.Lightning />
            <span className="mt-1 text-[9px]">TQQQ 策略</span>
          </button>
          <button onClick={() => setView('hi5_core')} className={`flex flex-col items-center py-1 px-1.5 ${view === 'hi5_core' ? 'text-emerald-400 font-bold' : 'text-gray-400'}`}>
            <Icons.Shield />
            <span className="mt-1 text-[9px]">Hi5 & Core</span>
          </button>
          <button onClick={() => setView('portfolio')} className={`flex flex-col items-center py-1 px-1.5 ${view === 'portfolio' ? 'text-cyan-400 font-bold' : 'text-gray-400'}`}>
            <Icons.List />
            <span className="mt-1 text-[9px]">Stock List</span>
          </button>
          <button onClick={() => { resetForm(); setView('add'); }} className={`flex flex-col items-center py-1 px-1.5 ${view === 'add' ? 'text-cyan-400 font-bold' : 'text-gray-400'}`}>
            <Icons.Plus />
            <span className="mt-1 text-[9px]">Add Buy</span>
          </button>
          <button onClick={() => setView('search')} className={`flex flex-col items-center py-1 px-1.5 ${view === 'search' || view === 'settings' ? 'text-cyan-400 font-bold' : 'text-gray-400'}`}>
            <Icons.Search />
            <span className="mt-1 text-[9px]">Search/API</span>
          </button>
          <button onClick={() => setView('history')} className={`flex flex-col items-center py-1 px-1.5 ${view === 'history' || view === 'edit' ? 'text-cyan-400 font-bold' : 'text-gray-400'}`}>
            <Icons.History />
            <span className="mt-1 text-[9px]">History</span>
          </button>
        </div>
      );

      return (
        <div className="flex flex-col h-full text-slate-100 select-none">
          
          {/* HEADER WITH CONDITIONAL TOP RIGHT ACCOUNT VALUE INPUT ONLY FOR TQQQ PAGE */}
          <div className="pt-5 pb-3 px-4 flex items-center justify-between border-b border-gray-800 bg-[#1A1A24]/90 backdrop-blur sticky top-0 z-20">
            <div className="flex items-center space-x-1.5">
              <span className="text-amber-400 font-bold"><Icons.Lightning /></span>
              <h1 className="text-sm font-extrabold text-white tracking-wide">US Stock & TQQQ</h1>
            </div>

            {/* Top Right Hand Corner: Display Account Value Input ONLY when view === 'tqqq' */}
            {view === 'tqqq' ? (
              <div className="flex items-center space-x-1.5 bg-gray-900/90 border border-amber-500/40 px-2.5 py-1 rounded-xl shadow-inner">
                <span className="text-[10px] text-amber-400 font-bold">帳戶價值:</span>
                <span className="text-xs text-amber-300 font-bold">$</span>
                <input 
                  type="number" 
                  value={accountValue} 
                  onChange={(e) => setAccountValue(e.target.value)}
                  className="w-20 bg-transparent text-right text-xs font-extrabold text-white focus:outline-none"
                />
              </div>
            ) : (
              <button 
                onClick={refreshPrices} 
                disabled={loadingPrices}
                className="p-1.5 rounded-full hover:bg-gray-800 text-cyan-400 transition flex items-center gap-1 text-xs"
                title="Refresh Prices"
              >
                <Icons.Refresh />
                <span className="hidden sm:inline">{loadingPrices ? 'Syncing...' : 'Sync'}</span>
              </button>
            )}
          </div>

          <div className="flex-1 overflow-y-auto no-scrollbar">

            {/* PAGE: HI5 & CORE STOCKS */}
            {view === 'hi5_core' && (
              <div className="p-4 space-y-5">
                
                {/* 1st Block: Hi5 */}
                <div className="bg-gray-900/80 border border-emerald-500/30 rounded-2xl p-4 space-y-3 shadow-lg">
                  <div className="flex justify-between items-center border-b border-gray-800 pb-2">
                    <h2 className="text-sm font-bold text-emerald-400 flex items-center gap-1.5">
                      <Icons.Shield />
                      <span>1. Hi5 ETFs</span>
                    </h2>
                    <span className="text-[10px] text-gray-400">5 ETF Watchlist</span>
                  </div>

                  {/* RSP Daily Change & Alert */}
                  <div className={`p-3 rounded-xl border flex justify-between items-center text-xs ${isRspAlert ? 'bg-red-950/80 border-red-600 text-red-200 animate-pulse' : 'bg-gray-950/80 border-gray-800 text-gray-300'}`}>
                    <div className="flex items-center gap-1.5 font-bold">
                      {isRspAlert && <Icons.Alert />}

                  </div>

                  <div className="space-y-1">
                    <label className="text-xs text-gray-400 font-medium ml-1">Stock Ticker Symbol (e.g. INTC, AAPL, RSP)</label>
                    <input 
                      type="text" 
                      placeholder="INTC or AAPL" 
                      value={formSymbol} 
                      onChange={(e) => setFormSymbol(e.target.value)}
                      className="w-full bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500 font-mono text-sm uppercase"
                    />
                  </div>

                  <div className="space-y-1">
                    <label className="text-xs text-gray-400 font-medium ml-1">Buy Date</label>
                    <input 
                      type="date" 
                      value={formDate} 
                      onChange={(e) => setFormDate(e.target.value)}
                      className="w-full bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500 text-sm"
                    />
                  </div>

                  <div className="space-y-1">
                    <label className="text-xs text-gray-400 font-medium ml-1">Buy-in Stock Price (USD)</label>
                    <div className="flex items-center bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-3">
                      <span className="text-sm font-bold mr-2 text-cyan-400">$</span>
                      <input 
                        type="number" 
                        step="0.01" 
                        placeholder="0.00" 
                        value={formPrice} 
                        onChange={(e) => setFormPrice(e.target.value)}
                        className="bg-transparent flex-1 text-lg text-white focus:outline-none font-semibold"
                      />
                    </div>
                  </div>

                  <div className="space-y-1">
                    <label className="text-xs text-gray-400 font-medium ml-1">Quantity (Shares)</label>
                    <input 
                      type="number" 
                      placeholder="e.g. 10" 
                      value={formQty} 
                      onChange={(e) => setFormQty(e.target.value)}
                      className="w-full bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500 text-sm font-semibold"
                    />
                  </div>

                  <div className="pt-2 flex gap-3">
                    {view === 'edit' && (
                      <button onClick={() => handleDeleteRecord(formId)} className="p-3 bg-red-900/30 text-red-400 border border-red-900 rounded-xl hover:bg-red-900/50 transition">
                        <Icons.Trash />
                      </button>
                    )}
                    <button 
                      onClick={handleSaveRecord}
                      className="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition"
                    >
                      {view === 'edit' ? 'Update Buy Record' : 'Save Buy Record'}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* PAGE 3: SEARCH & SETTINGS */}
            {(view === 'search' || view === 'settings') && (
              <div className="p-4 space-y-6">
                <div className="space-y-3">
                  <h2 className="text-base font-bold text-white">Stock Search</h2>
                  <div className="flex gap-2">
                    <input 
                      type="text" 
                      placeholder="e.g. INTC, MSFT, NVDA"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && handleSearch()}
                      className="flex-1 bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500 uppercase"
                    />
                    <button 
                      onClick={handleSearch}
                      disabled={searchLoading}
                      className="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center"
                    >
                      {searchLoading ? '...' : <Icons.Search />}
                    </button>
                  </div>

                  {searchError && (
                    <div className="p-3 bg-red-950/40 border border-red-800/50 text-red-300 rounded-xl text-xs leading-relaxed">
                      {searchError}
                    </div>
                  )}

                  {searchResult && (
                    <div className="bg-gray-900/80 border border-gray-800 rounded-2xl p-4 space-y-3">
                      <div className="flex justify-between items-start">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="text-base font-extrabold text-white">{searchResult.symbol}</span>
                            <a href={`https://hk.finance.yahoo.com/quote/${searchResult.symbol}/`} target="_blank" rel="noopener noreferrer" className="text-gray-400 hover:text-cyan-400">
                              <Icons.ExternalLink />
                            </a>
                          </div>
                          <div className="text-xs text-gray-400">Source: {searchResult.source}</div>
                        </div>
                        <div className="text-right">
                          <div className="text-lg font-bold text-cyan-300">{formatUSD(searchResult.price)}</div>
                          <div className={`text-xs font-bold ${searchResult.changePercent >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                            {formatPercent(searchResult.changePercent)}
                          </div>
                        </div>
                      </div>
                      <button 
                        onClick={() => {
                          setFormSymbol(searchResult.symbol);
                          setFormPrice(searchResult.price);
                          setView('add');
                        }}
                        className="w-full bg-cyan-900/40 border border-cyan-500/40 text-cyan-300 py-2 rounded-xl text-xs font-bold hover:bg-cyan-900/70 transition"
                      >
                        + Add Buy-in for {searchResult.symbol}
                      </button>
                    </div>
                  )}
                </div>

                <hr className="border-gray-800" />

                <div className="space-y-4 bg-gray-900/60 border border-gray-800 rounded-2xl p-4">
                  <h2 className="text-base font-bold text-white flex items-center gap-1.5">
                    <Icons.Key />
                    <span>Finnhub API Key Settings</span>
                  </h2>
                  <p className="text-xs text-gray-400 leading-relaxed">
                    Paste your Finnhub API Key below to enable live price auto-refreshing across your stock portfolio & TQQQ strategy page:
                  </p>

                  <div className="space-y-1">
                    <input 
                      type="password" 
                      placeholder="Paste Finnhub API Key" 
                      value={finnhubApiKey}
                      onChange={(e) => setFinnhubApiKey(e.target.value)}
                      className="w-full bg-gray-950 text-white text-xs px-3 py-2.5 rounded-xl border border-gray-800 focus:outline-none focus:border-cyan-500 font-mono"
                    />
                    <div className="text-[10px] text-cyan-400 text-right">
                      <a href="https://finnhub.io/register" target="_blank" rel="noopener noreferrer" className="underline">Get free Finnhub API key →</a>
                    </div>
                  </div>

                  <hr className="border-gray-800/80" />

                  <div className="space-y-2">
                    <label className="text-xs text-gray-400">Target Portfolio Amount (USD)</label>
                    <div className="flex items-center bg-gray-950 border border-gray-800 rounded-xl px-3 py-2">
                      <span className="text-xs text-cyan-400 mr-1 font-bold">$</span>
                      <input 
                        type="number" 
                        value={targetAmount} 
                        onChange={(e) => setTargetAmount(e.target.value)}
                        className="bg-transparent flex-1 text-sm text-white font-bold focus:outline-none"
                      />
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* PAGE 4: HISTORY */}
            {view === 'history' && (
              <div className="p-4 space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="text-base font-bold text-white">Buy History Records</h2>
                  <span className="text-xs text-gray-400">{records.length} Total Records</span>
                </div>

                {records.length === 0 ? (
                  <div className="py-12 text-center text-gray-500 text-xs space-y-3">
                    <Icons.History />
                    <p>No buy history recorded yet.</p>
                  </div>
                ) : (
                  <div className="space-y-2">
                    {records.sort((a,b) => new Date(b.date) - new Date(a.date)).map(r => (
                      <div 
                        key={r.id} 
                        onClick={() => openEditRecord(r)}
                        className="bg-gray-900/60 border border-gray-800 p-3.5 rounded-xl flex justify-between items-center cursor-pointer hover:bg-gray-800/60 transition"
                      >
                        <div className="space-y-0.5">
                          <div className="flex items-center gap-1.5">
                            <span className="text-sm font-extrabold text-cyan-300 font-mono">{r.symbol}</span>
                            <span className={`text-[9px] px-1.5 py-0.2 rounded font-bold ${r.category === 'core_stocks' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-gray-800 text-gray-400'}`}>
                              {r.category === 'core_stocks' ? 'Core' : 'List'}
                            </span>
                          </div>
                          <div className="text-xs text-gray-400">{r.date} • {r.quantity} shares</div>
                        </div>
                        <div className="text-right">
                          <div className="text-sm font-bold text-gray-200">{formatUSD(r.price)} / share</div>
                          <div className="text-xs text-cyan-400 font-semibold">Total: {formatUSD(r.price * r.quantity)}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

          </div>

          {renderBottomNav()}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
