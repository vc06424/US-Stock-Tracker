<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>US Stock Portfolio Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #121218;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }
  </style>
</head>
<body class="bg-[#121218] min-h-screen flex justify-center items-center p-0 sm:p-4">
  <div id="root" class="w-full max-w-md bg-[#1A1A24] min-h-screen sm:min-h-[844px] sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative border border-gray-800"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // SVG Icons
    const Icons = {
      Plus: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>,
      List: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>,
      Search: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
      Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
      History: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      Refresh: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>,
      Trash: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
      ChevronLeft: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg>
    };

    const cleanSymbol = (input) => {
      if (!input) return '';
      let sym = input.trim().toUpperCase();
      if (sym.includes(':')) {
        sym = sym.split(':')[1].trim();
      }
      return sym;
    };

    const getTodayDate = () => {
      const d = new Date();
      const month = `${d.getMonth() + 1}`.padStart(2, '0');
      const day = `${d.getDate()}`.padStart(2, '0');
      return `${d.getFullYear()}-${month}-${day}`;
    };

    const formatUSD = (val) => {
      if (val === null || val === undefined || isNaN(val)) return '$0.00';
      return '$' + Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    const formatPercent = (val) => {
      if (val === null || val === undefined || isNaN(val)) return '0.00%';
      const formatted = Number(val).toFixed(2) + '%';
      return val >= 0 ? `+${formatted}` : formatted;
    };

    // Yahoo Finance price fetcher using public chart proxies
    const fetchYahooQuote = async (rawSymbol) => {
      const symbol = cleanSymbol(rawSymbol);
      if (!symbol) return null;

      const proxies = [
        `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1m&range=1d`,
        `https://corsproxy.io/?${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1m&range=1d`)}`
      ];

      for (let url of proxies) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const data = await res.json();
          const result = data?.chart?.result?.[0];
          if (result && result.meta) {
            const meta = result.meta;
            const price = meta.regularMarketPrice;
            const prevClose = meta.chartPreviousClose || meta.previousClose;
            const change = price - prevClose;
            const changePercent = prevClose ? (change / prevClose) * 100 : 0;
            return {
              symbol,
              name: meta.shortName || meta.longName || symbol,
              exchange: meta.exchangeName || 'US',
              price,
              prevClose,
              change,
              changePercent,
              currency: meta.currency || 'USD'
            };
          }
        } catch (e) {
          console.warn(`Proxy failed for ${symbol}:`, e);
        }
      }
      return null;
    };

    function App() {
      // Navigation
      const [view, setView] = useState('portfolio'); // 'add', 'portfolio', 'search', 'settings', 'history', 'edit'

      // Data Persistence
      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('st_records');
        return saved ? JSON.parse(saved) : [];
      });

      const [targetAmount, setTargetAmount] = useState(() => {
        return localStorage.getItem('st_target_amount') || '50000';
      });

      // Prices Cache
      const [prices, setPrices] = useState({});
      const [loadingPrices, setLoadingPrices] = useState(false);

      // Form State (Add / Edit)
      const [formId, setFormId] = useState(null);
      const [formSymbol, setFormSymbol] = useState('');
      const [formDate, setFormDate] = useState(getTodayDate());
      const [formPrice, setFormPrice] = useState('');
      const [formQty, setFormQty] = useState('');

      // Search State
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResult, setSearchResult] = useState(null);
      const [searchLoading, setSearchLoading] = useState(false);
      const [searchError, setSearchError] = useState('');

      useEffect(() => { localStorage.setItem('st_records', JSON.stringify(records)); }, [records]);
      useEffect(() => { localStorage.setItem('st_target_amount', targetAmount); }, [targetAmount]);

      // Unique Stock Symbols
      const uniqueSymbols = useMemo(() => {
        return Array.from(new Set(records.map(r => cleanSymbol(r.symbol)))).filter(Boolean);
      }, [records]);

      // Refresh Prices
      const refreshPrices = async () => {
        if (uniqueSymbols.length === 0) return;
        setLoadingPrices(true);
        const newPrices = { ...prices };
        for (let sym of uniqueSymbols) {
          const q = await fetchYahooQuote(sym);
          if (q) newPrices[sym] = q;
        }
        setPrices(newPrices);
        setLoadingPrices(false);
      };

      useEffect(() => {
        refreshPrices();
      }, [uniqueSymbols.join(',')]);

      // Aggregated Portfolio Data
      const portfolioData = useMemo(() => {
        const group = {};

        records.forEach(r => {
          const sym = cleanSymbol(r.symbol);
          if (!sym) return;

          if (!group[sym]) {
            group[sym] = {
              symbol: sym,
              records: [],
              totalQty: 0,
              totalCost: 0
            };
          }

          const qty = Number(r.quantity) || 0;
          const price = Number(r.price) || 0;

          group[sym].records.push(r);
          group[sym].totalQty += qty;
          group[sym].totalCost += qty * price;
        });

        return Object.values(group).map(item => {
          // Sort records by date ascending to find last buy
          const sortedRecs = [...item.records].sort((a,b) => new Date(a.date) - new Date(b.date));
          const lastRecord = sortedRecs[sortedRecs.length - 1] || {};
          
          const lastBuyPrice = Number(lastRecord.price) || 0;
          const avgBuyPrice = item.totalQty > 0 ? item.totalCost / item.totalQty : 0;
          const quote = prices[item.symbol] || {};
          const currentPrice = quote.price || 0;

          const lastDiffPct = lastBuyPrice > 0 && currentPrice > 0 ? ((currentPrice - lastBuyPrice) / lastBuyPrice) * 100 : 0;
          const avgDiffPct = avgBuyPrice > 0 && currentPrice > 0 ? ((currentPrice - avgBuyPrice) / avgBuyPrice) * 100 : 0;
          const marketValue = item.totalQty * (currentPrice || avgBuyPrice);

          return {
            ...item,
            lastBuyPrice,
            avgBuyPrice,
            currentPrice,
            lastDiffPct,
            avgDiffPct,
            marketValue,
            quote
          };
        });
      }, [records, prices]);

      const totalPortfolioValue = useMemo(() => {
        return portfolioData.reduce((sum, item) => sum + item.marketValue, 0);
      }, [portfolioData]);

      // Form Save Handler
      const handleSaveRecord = () => {
        const sym = cleanSymbol(formSymbol);
        if (!sym) return alert('Please enter a valid stock ticker name.');
        if (!formPrice || Number(formPrice) <= 0) return alert('Please enter a valid buy-in price.');
        if (!formQty || Number(formQty) <= 0) return alert('Please enter a valid quantity.');

        const newRecord = {
          id: formId || Date.now().toString(),
          symbol: sym,
          date: formDate,
          price: Number(formPrice),
          quantity: Number(formQty)
        };

        if (formId) {
          setTransactions(prev => prev.map(r => r.id === formId ? newRecord : r)); // legacy compatibility
          setRecords(prev => prev.map(r => r.id === formId ? newRecord : r));
          setView('history');
        } else {
          setRecords(prev => [newRecord, ...prev]);
          resetForm();
          setView('portfolio');
        }
      };

      const resetForm = () => {
        setFormId(null);
        setFormSymbol('');
        setFormDate(getTodayDate());
        setFormPrice('');
        setFormQty('');
      };

      const openEditRecord = (r) => {
        setFormId(r.id);
        setFormSymbol(r.symbol);
        setFormDate(r.date);
        setFormPrice(r.price);
        setFormQty(r.quantity);
        setView('edit');
      };

      const handleDeleteRecord = (id) => {
        if (confirm('Delete this buy-in record?')) {
          setRecords(prev => prev.filter(r => r.id !== id));
          if (view === 'edit') setView('history');
        }
      };

      // Search Handler
      const handleSearch = async () => {
        const sym = cleanSymbol(searchQuery);
        if (!sym) return;
        setSearchLoading(true);
        setSearchError('');
        setSearchResult(null);

        const res = await fetchYahooQuote(sym);
        if (res) {
          setSearchResult(res);
        } else {
          setSearchError('Stock quote not found. Please verify ticker symbol (e.g. MSFT or NASDAQ:MSFT).');
        }
        setSearchLoading(false);
      };

      // Top Header
      const renderHeader = () => (
        <div className="pt-6 pb-3 px-4 flex items-center justify-between border-b border-gray-800 bg-[#1A1A24]/90 backdrop-blur sticky top-0 z-20">
          <div className="flex items-center space-x-2">
            <h1 className="text-base font-bold text-white tracking-wide">US Stock Tracker</h1>
          </div>
          <button 
            onClick={refreshPrices} 
            disabled={loadingPrices}
            className="p-1.5 rounded-full hover:bg-gray-800 text-cyan-400 transition flex items-center gap-1 text-xs"
            title="Refresh Prices"
          >
            <Icons.Refresh />
            <span className="hidden sm:inline">{loadingPrices ? 'Refreshing...' : 'Sync'}</span>
          </button>
        </div>
      );

      // Bottom Navigation Bar
      const renderBottomNav = () => (
        <div className="border-t border-gray-800 bg-[#161620] px-2 py-2 flex justify-around items-center sticky bottom-0 z-20 text-xs">
          <button onClick={() => setView('portfolio')} className={`flex flex-col items-center py-1 px-2 ${view === 'portfolio' ? 'text-cyan-400 font-bold' : 'text-gray-400'}`}>
            <Icons.List />
            <span className="mt-1 text-[10px]">My Stock</span>
          </button>
          <button onClick={() => { resetForm(); setView('add'); }} className={`flex flex-col items-center py-1 px-2 ${view === 'add' ? 'text-cyan-400 font-bold' : 'text-gray-400'}`}>
            <Icons.Plus />
            <span className="mt-1 text-[10px]">Add Buy</span>
          </button>
          <button onClick={() => setView('search')} className={`flex flex-col items-center py-1 px-2 ${view === 'search' || view === 'settings' ? 'text-cyan-400 font-bold' : 'text-gray-400'}`}>
            <Icons.Search />
            <span className="mt-1 text-[10px]">Search/Target</span>
          </button>
          <button onClick={() => setView('history')} className={`flex flex-col items-center py-1 px-2 ${view === 'history' || view === 'edit' ? 'text-cyan-400 font-bold' : 'text-gray-400'}`}>
            <Icons.History />
            <span className="mt-1 text-[10px]">History</span>
          </button>
        </div>
      );

      return (
        <div className="flex flex-col h-full text-slate-100 select-none">
          {renderHeader()}

          <div className="flex-1 overflow-y-auto no-scrollbar">

            {/* PAGE 1: ADD BUY RECORD / EDIT */}
            {(view === 'add' || view === 'edit') && (
              <div className="p-5 space-y-5">
                <div className="flex justify-between items-center border-b border-gray-800 pb-2">
                  <h2 className="text-base font-bold text-cyan-400">{view === 'edit' ? 'Edit Buy-in Record' : '1. Add Buy-in Record'}</h2>
                  {view === 'edit' && (
                    <button onClick={() => setView('history')} className="text-xs text-gray-400 flex items-center gap-1"><Icons.ChevronLeft /> Back</button>
                  )}
                </div>

                <div className="space-y-4">
                  <div className="space-y-1">
                    <label className="text-xs text-gray-400 font-medium ml-1">Stock Ticker (e.g. NASDAQ:MSFT or MSFT)</label>
                    <input 
                      type="text" 
                      placeholder="NASDAQ:MSFT or NVDA" 
                      value={formSymbol} 
                      onChange={(e) => setFormSymbol(e.target.value)}
                      className="w-full bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500 font-mono text-sm uppercase"
                    />
                  </div>

                  <div className="space-y-1">
                    <label className="text-xs text-gray-400 font-medium ml-1">Buy Date</label>
                    <input 
                      type="date" 
                      value={formDate} 
                      onChange={(e) => setFormDate(e.target.value)}
                      className="w-full bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500 text-sm"
                    />
                  </div>

                  <div className="space-y-1">
                    <label className="text-xs text-gray-400 font-medium ml-1">Buy-in Stock Price (USD)</label>
                    <div className="flex items-center bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-3">
                      <span className="text-sm font-bold mr-2 text-cyan-400">$</span>
                      <input 
                        type="number" 
                        step="0.01" 
                        placeholder="0.00" 
                        value={formPrice} 
                        onChange={(e) => setFormPrice(e.target.value)}
                        className="bg-transparent flex-1 text-lg text-white focus:outline-none font-semibold"
                      />
                    </div>
                  </div>

                  <div className="space-y-1">
                    <label className="text-xs text-gray-400 font-medium ml-1">Quantity (Shares)</label>
                    <input 
                      type="number" 
                      placeholder="e.g. 10" 
                      value={formQty} 
                      onChange={(e) => setFormQty(e.target.value)}
                      className="w-full bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500 text-sm font-semibold"
                    />
                  </div>

                  <div className="pt-2 flex gap-3">
                    {view === 'edit' && (
                      <button onClick={() => handleDeleteRecord(formId)} className="p-3 bg-red-900/30 text-red-400 border border-red-900 rounded-xl hover:bg-red-900/50 transition">
                        <Icons.Trash />
                      </button>
                    )}
                    <button 
                      onClick={handleSaveRecord}
                      className="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition"
                    >
                      {view === 'edit' ? 'Update Buy Record' : 'Save Buy Record'}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* PAGE 2: MY STOCK LIST */}
            {view === 'portfolio' && (
              <div className="p-4 space-y-4">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-base font-bold text-white">2. My Stock List</h2>
                    <p className="text-xs text-gray-400">Total Market Value: <span className="text-cyan-400 font-bold">{formatUSD(totalPortfolioValue)}</span></p>
                  </div>
                  <span className="text-[10px] bg-cyan-950/80 text-cyan-400 border border-cyan-800/60 px-2 py-1 rounded-md">
                    {portfolioData.length} Holdings
                  </span>
                </div>

                {portfolioData.length === 0 ? (
                  <div className="py-12 text-center text-gray-500 text-xs space-y-3">
                    <Icons.List />
                    <p>No holdings added yet. Click "+" to add your first buy-in record.</p>
                  </div>
                ) : (
                  <div className="space-y-3">
                    {portfolioData.map(item => {
                      const lastDiffColor = item.lastDiffPct >= 0 ? 'text-emerald-400' : 'text-red-400';
                      const avgDiffColor = item.avgDiffPct >= 0 ? 'text-emerald-400' : 'text-red-400';

                      return (
                        <div key={item.symbol} className="bg-gray-900/70 border border-gray-800 rounded-2xl p-4 space-y-3 shadow">
                          <div className="flex justify-between items-start border-b border-gray-800/80 pb-2.5">
                            <div>
                              <span className="text-base font-extrabold text-white tracking-wider font-mono">{item.symbol}</span>
                              <div className="text-[10px] text-gray-400 truncate max-w-[180px]">{item.quote.name || 'US Stock'}</div>
                            </div>
                            <div className="text-right">
                              <div className="text-xs text-gray-400">現價 (Current)</div>
                              <div className="text-sm font-bold text-cyan-300">{formatUSD(item.currentPrice)}</div>
                            </div>
                          </div>

                          <div className="grid grid-cols-2 gap-2 text-xs">
                            <div className="bg-gray-950/60 border border-gray-800/60 p-2 rounded-xl">
                              <div className="text-[10px] text-gray-400">上次買入價</div>
                              <div className="font-semibold text-gray-200 mt-0.5">{formatUSD(item.lastBuyPrice)}</div>
                              <div className={`text-[10px] font-bold mt-1 ${lastDiffColor}`}>
                                現價/上次價差: {formatPercent(item.lastDiffPct)}
                              </div>
                            </div>

                            <div className="bg-gray-950/60 border border-gray-800/60 p-2 rounded-xl">
                              <div className="text-[10px] text-gray-400">平均買入價</div>
                              <div className="font-semibold text-gray-200 mt-0.5">{formatUSD(item.avgBuyPrice)}</div>
                              <div className={`text-[10px] font-bold mt-1 ${avgDiffColor}`}>
                                現價/平均價差: {formatPercent(item.avgDiffPct)}
                              </div>
                            </div>
                          </div>

                          <div className="flex justify-between items-center text-xs pt-1 border-t border-gray-800/50">
                            <div>
                              <span className="text-gray-400">已有數量: </span>
                              <span className="font-bold text-gray-200">{item.totalQty} 股</span>
                            </div>
                            <div>
                              <span className="text-gray-400">總額: </span>
                              <span className="font-bold text-cyan-400">{formatUSD(item.marketValue)}</span>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {/* PAGE 3: SEARCH & SETTINGS */}
            {(view === 'search' || view === 'settings') && (
              <div className="p-4 space-y-6">
                {/* Search Section */}
                <div className="space-y-3">
                  <h2 className="text-base font-bold text-white">3. Stock Search</h2>
                  <div className="flex gap-2">
                    <input 
                      type="text" 
                      placeholder="Enter stock name e.g. NASDAQ:MSFT"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && handleSearch()}
                      className="flex-1 bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500 uppercase"
                    />
                    <button 
                      onClick={handleSearch}
                      disabled={searchLoading}
                      className="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center"
                    >
                      {searchLoading ? '...' : <Icons.Search />}
                    </button>
                  </div>

                  {searchError && (
                    <div className="p-3 bg-red-950/40 border border-red-800/50 text-red-300 rounded-xl text-xs">
                      {searchError}
                    </div>
                  )}

                  {searchResult && (
                    <div className="bg-gray-900/80 border border-gray-800 rounded-2xl p-4 space-y-3">
                      <div className="flex justify-between items-start">
                        <div>
                          <div className="text-base font-extrabold text-white">{searchResult.symbol}</div>
                          <div className="text-xs text-gray-400">{searchResult.name} ({searchResult.exchange})</div>
                        </div>
                        <div className="text-right">
                          <div className="text-lg font-bold text-cyan-300">{formatUSD(searchResult.price)}</div>
                          <div className={`text-xs font-bold ${searchResult.change >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                            {formatPercent(searchResult.changePercent)}
                          </div>
                        </div>
                      </div>
                      <button 
                        onClick={() => {
                          setFormSymbol(searchResult.symbol);
                          setFormPrice(searchResult.price);
                          setView('add');
                        }}
                        className="w-full bg-cyan-900/40 border border-cyan-500/40 text-cyan-300 py-2 rounded-xl text-xs font-bold hover:bg-cyan-900/70 transition"
                      >
                        + Add Buy-in for {searchResult.symbol}
                      </button>
                    </div>
                  )}
                </div>

                <hr className="border-gray-800" />

                {/* Target Amount & Progress Section */}
                <div className="space-y-3 bg-gray-900/60 border border-gray-800 rounded-2xl p-4">
                  <h2 className="text-base font-bold text-white">3. Settings & Target Portfolio</h2>
                  <div className="space-y-2">
                    <label className="text-xs text-gray-400">Input Target Portfolio Amount (USD)</label>
                    <div className="flex items-center bg-gray-950 border border-gray-800 rounded-xl px-3 py-2">
                      <span className="text-xs text-cyan-400 mr-1 font-bold">$</span>
                      <input 
                        type="number" 
                        value={targetAmount} 
                        onChange={(e) => setTargetAmount(e.target.value)}
                        className="bg-transparent flex-1 text-sm text-white font-bold focus:outline-none"
                      />
                    </div>
                  </div>

                  {/* Progress Display */}
                  {Number(targetAmount) > 0 && (
                    <div className="space-y-1.5 pt-2">
                      <div className="flex justify-between text-xs">
                        <span className="text-gray-400">Current Progress</span>
                        <span className="font-bold text-cyan-400">
                          {((totalPortfolioValue / Number(targetAmount)) * 100).toFixed(1)}%
                        </span>
                      </div>
                      <div className="w-full h-2.5 bg-gray-800 rounded-full overflow-hidden">
                        <div 
                          className="h-full bg-gradient-to-r from-cyan-500 to-blue-500 rounded-full transition-all duration-500"
                          style={{ width: `${Math.min((totalPortfolioValue / Number(targetAmount)) * 100, 100)}%` }}
                        />
                      </div>
                      <div className="flex justify-between text-[10px] text-gray-500 pt-0.5">
                        <span>Current: {formatUSD(totalPortfolioValue)}</span>
                        <span>Target: {formatUSD(targetAmount)}</span>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* PAGE 4: HISTORY */}
            {view === 'history' && (
              <div className="p-4 space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="text-base font-bold text-white">4. Buy History Records</h2>
                  <span className="text-xs text-gray-400">{records.length} Total Records</span>
                </div>

                {records.length === 0 ? (
                  <div className="py-12 text-center text-gray-500 text-xs space-y-3">
                    <Icons.History />
                    <p>No buy history recorded yet.</p>
                  </div>
                ) : (
                  <div className="space-y-2">
                    {records.sort((a,b) => new Date(b.date) - new Date(a.date)).map(r => (
                      <div 
                        key={r.id} 
                        onClick={() => openEditRecord(r)}
                        className="bg-gray-900/60 border border-gray-800 p-3.5 rounded-xl flex justify-between items-center cursor-pointer hover:bg-gray-800/60 transition"
                      >
                        <div className="space-y-0.5">
                          <div className="text-sm font-extrabold text-cyan-300 font-mono">{r.symbol}</div>
                          <div className="text-xs text-gray-400">{r.date} • {r.quantity} shares</div>
                        </div>
                        <div className="text-right">
                          <div className="text-sm font-bold text-gray-200">{formatUSD(r.price)} / share</div>
                          <div className="text-xs text-cyan-400 font-semibold">Total: {formatUSD(r.price * r.quantity)}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

          </div>

          {renderBottomNav()}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
